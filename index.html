<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ali Jutt portfolio - software developer, automation, web apps, product engineering." />
    <title>Ali Jutt</title>
    <link rel="icon" href="https://avatars.githubusercontent.com/u/203925841?v=4" type="image/png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="full-box">
      <div id="background-slide-button" class="spawn-background-slide-button"></div>
      <div id="scale-box" class="scale-box">
        <div class="content-box slide-down"></div>
        <div class="content-box slide-up"></div>
        <div class="content-box slide-down"></div>
        <div class="content-box slide-up"></div>
        <div class="content-box slide-down"></div>
        <div class="content-box slide-up"></div>
        <div class="content-box slide-down"></div>
        <div class="content-box slide-up"></div>
        <div class="ngisor-background"></div>
      </div>
    </div>

    <div class="center">
      <div id="app-navigator" class="base-unshown-app"></div>
    </div>

    <div class="center">
      <div id="menu-box" class="menu-box">
        <div id="spawn-app-home" class="spawn-apk home active" onclick="toggleAppNavigation('home')">
          <i class="fa-solid fa-house"></i>
        </div>
        <div id="spawn-app-biodata" class="spawn-apk biodata" onclick="toggleAppNavigation('biodata')">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <div id="spawn-app-termux" class="spawn-apk termux" onclick="toggleAppNavigation('termux')">
          <i class="fa-solid fa-terminal"></i>
        </div>
        <div id="spawn-app-project" class="spawn-apk project" onclick="toggleAppNavigation('project')">
          <i class="fa-solid fa-code"></i>
        </div>
        <div id="spawn-app-portfolio" class="spawn-apk portfolio" onclick="toggleAppNavigation('portfolio')">
          <i class="fa-regular fa-file"></i>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
